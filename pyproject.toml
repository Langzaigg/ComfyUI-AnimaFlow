[project]
name = "comfyui-animaflow"
version = "1.0.0"
description = "AnimaFlow（前身 ComfyUI-AnimaTool）：多模型多工作流的 AI Tool Use API（Anima base/turbo/2.9B/Aura 等）。支持 MCP Server（Cursor/Claude 原生显示图片）、HTTP API 和 CLI。"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["comfyui", "anima", "anime", "illustration", "mcp", "tool-use", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "aiohttp",
    "requests",
]

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/Moeblack/ComfyUI-AnimaTool"
Repository = "https://github.com/Moeblack/ComfyUI-AnimaTool"
Documentation = "https://github.com/Moeblack/ComfyUI-AnimaTool/wiki"
Issues = "https://github.com/Moeblack/ComfyUI-AnimaTool/issues"

[tool.comfy]
PublisherId = "YOUR_PUBLISHER_ID"
DisplayName = "AnimaFlow"
Icon = "assets/screenshot.webp"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
